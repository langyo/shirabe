[package]
name = "shirabe"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["langyo <langyo.china@gmail.com>"]
license = "SySL-1.0"
description = "Lightweight headless browser automation — CDP engine + HTTP debug API"
repository = "https://github.com/celestia-island/shirabe"
keywords = ["browser", "cdp", "chrome", "headless", "automation"]
categories = ["web-programming", "api-bindings", "development-tools"]

[lib]
name = "shirabe"
path = "src/lib.rs"

[[bin]]
name = "shirabe"
path = "src/main.rs"

[dependencies]
tokio = { version = "^1", features = ["rt-multi-thread", "net", "process", "macros", "time", "sync"] }
tokio-tungstenite = { version = "^0.27", features = ["rustls-tls-webpki-roots"] }
axum = "^0.8"
tower-http = { version = "^0.6", features = ["cors", "compression-gzip"] }
reqwest = { version = "^0.13", features = ["json", "rustls"], default-features = false }
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
futures = "^0.3"
futures-util = "^0.3"
chrono = "^0.4"
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }
clap = { version = "^4", features = ["derive"] }
anyhow = "^1"
